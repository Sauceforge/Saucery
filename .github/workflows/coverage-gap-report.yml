name: Saucery Coverage Gap Report

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

  push:
    branches:
      - master
    paths:
      - "Saucery.Core/**"
      - "Saucery.Core.Tests/**"
      - "Saucery.Core.Tests.XUnitv3/**"
      - "Saucery.CoverageGapReporter/**"
      - ".github/workflows/coverage-gap-report.yml"

permissions:
  contents: write

jobs:
  coverage-gap-report:
    name: Generate Saucery Coverage Gap Report
    runs-on: ubuntu-latest

    env:
      SAUCE_USER_NAME: ${{ secrets.SAUCE_USER_NAME }}
      SAUCE_API_KEY: ${{ secrets.SAUCE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Display .NET information
        run: dotnet --info

      - name: Restore Coverage Gap Reporter
        run: >
          dotnet restore
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj

      - name: Build Coverage Gap Reporter
        run: >
          dotnet build
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration Release
          --no-restore

      - name: Run Coverage Gap Reporter
        run: >
          dotnet run
          --project Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration Release
          --no-build
          --
          --repo-root "${{ github.workspace }}"
          --output "${{ github.workspace }}/saucery-functional-platform-coverage-gaps.txt"
          --region us-west-1
          --include-real true

      - name: Print Coverage Gap Report
        run: cat saucery-functional-platform-coverage-gaps.txt

      - name: Upload Coverage Gap Report
        uses: actions/upload-artifact@v7
        with:
          name: saucery-functional-platform-coverage-gaps
          path: saucery-functional-platform-coverage-gaps.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit README coverage table
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README platform coverage table is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: update platform coverage audit"
          git push origin HEAD:master
