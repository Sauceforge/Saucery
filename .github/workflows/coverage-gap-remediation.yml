name: Saucery Coverage Gap Remediation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    name: Remediate platform coverage gaps
    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore Coverage Gap Reporter
        run: >
          dotnet restore
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj

      - name: Build Coverage Gap Reporter
        run: >
          dotnet build
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration Release
          --no-restore

      - name: Restore Coverage Gap Remediator
        run: >
          dotnet restore
          Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj

      - name: Build Coverage Gap Remediator
        run: >
          dotnet build
          Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj
          --configuration Release
          --no-restore

      - name: Generate current coverage gap report
        run: >
          dotnet run
          --project Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration Release
          --no-build
          --
          --repo-root "${{ github.workspace }}"
          --output "${{ github.workspace }}/saucery-functional-platform-coverage-gaps.txt"
          --region us-west-1
          --include-real true

      - name: Print coverage gap report
        run: cat saucery-functional-platform-coverage-gaps.txt

      - name: Apply supported remediations
        run: >
          dotnet run
          --project Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj
          --configuration Release
          --no-build
          --
          --repo-root "${{ github.workspace }}"
          --report "${{ github.workspace }}/saucery-functional-platform-coverage-gaps.txt"
          --apply

      - name: Show resulting changes
        run: |
          git status --short
          git diff --stat
          git diff

      - name: Check whether source changed
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create remediation branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          BRANCH="automation/platform-coverage-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Commit remediation
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "fix: align Saucery platform coverage with Sauce Labs"

      - name: Push remediation branch
        if: steps.changes.outputs.changed == 'true'
        run: >
          git push
          --set-upstream origin
          "${{ steps.branch.outputs.name }}"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head "${{ steps.branch.outputs.name }}" \
            --title "fix: align Saucery platform coverage with Sauce Labs" \
            --body "Automated remediation generated by Saucery.CoverageGapRemediator.

          The workflow:
          - generated the current Sauce Labs platform coverage report
          - applied inferred remediations
          - validated the generated Core and test projects
          - reran the coverage reporter

          Review the generated source and test changes before merging."

      - name: No remediation required
        if: steps.changes.outputs.changed == 'false'
        run: echo "No repository changes were required."