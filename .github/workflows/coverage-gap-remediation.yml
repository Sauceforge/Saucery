name: Saucery Platform Coverage Remediation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"
  
  push:
    paths:
      - "Saucery.CoverageGapRemediator/**"
      - ".github/workflows/coverage-gap-remediation.yml"

permissions:
  contents: write
  pull-requests: write

env:
  CONFIG: Release
  UT_PROJECT: Saucery.Core.Tests.XUnitv3/Saucery.Core.Tests.XUnitv3.csproj
  COVERAGE_FORMAT: cobertura
  UNIT_COVERAGE_FILENAME: coverage.cobertura.xml
  SAUCE_USER_NAME: ${{ secrets.SAUCE_USER_NAME }}
  SAUCE_API_KEY: ${{ secrets.SAUCE_API_KEY }}

jobs:
  remediate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore Coverage Gap Reporter
        run: >
          dotnet restore
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj

      - name: Build Coverage Gap Reporter
        run: >
          dotnet build
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration ${{ env.CONFIG }}
          --no-restore

      - name: Restore Coverage Gap Remediator
        run: >
          dotnet restore
          Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj

      - name: Build Coverage Gap Remediator
        run: >
          dotnet build
          Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj
          --configuration ${{ env.CONFIG }}
          --no-restore

      - name: Generate platform coverage report
        run: >
          dotnet run
          --project Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration ${{ env.CONFIG }}
          --no-build

      - name: Print platform coverage report
        run: cat saucery-functional-platform-coverage-gaps.txt

      - name: Apply platform remediations
        run: >
          dotnet run
          --project Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj
          --configuration ${{ env.CONFIG }}
          --no-build
          --
          --apply
          --allow-obsolete-removal

      - name: Show remediation diff
        run: |
          git status --short
          git diff --stat
          git diff

      - name: Check for actionable remediation changes
        id: actionable
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(
            git status \
              --porcelain=v1 \
              --untracked-files=all |
            cut -c4-
          )"

          echo "All changed files:"
          printf '%s\n' "$changed_files"

          actionable_files="$(
            printf '%s\n' "$changed_files" |
            grep -v -x 'saucery-platform-remediation-plan.json' |
            grep -v -x 'saucery-platform-remediation-plan.md' ||
            true
          )"

          echo
          echo "Actionable changed files:"
          printf '%s\n' "$actionable_files"

          if [[ -n "$actionable_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Actionable remediation changes exist."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only remediation-plan files changed."
            echo "Skipping solution validation, xUnit tests, branch creation, commit, push, and pull request."
          fi

      - name: Compile remediated solution
        if: steps.actionable.outputs.changed == 'true'
        run: dotnet build -c ${{ env.CONFIG }}

      - name: Run xUnit.v3 unit tests
        if: steps.actionable.outputs.changed == 'true'
        uses: ./.github/actions/run-xunit3-coverage
        with:
          project: ${{ env.UT_PROJECT }}
          configuration: ${{ env.CONFIG }}
          coverage-format: ${{ env.COVERAGE_FORMAT }}
          coverage-output: ${{ env.UNIT_COVERAGE_FILENAME }}

      - name: Create remediation branch
        if: success() && steps.actionable.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          branch="automated/platform-coverage-remediation-$(date -u +%Y%m%d%H%M%S)"

          git switch -c "$branch"

          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Commit remediation
        if: success() && steps.actionable.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "Remediate Sauce platform coverage"

      - name: Push remediation branch
        if: success() && steps.actionable.outputs.changed == 'true'
        run: |
          git push \
            --set-upstream \
            origin \
            "${{ steps.branch.outputs.name }}"

      - name: Create pull request
        if: success() && steps.actionable.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Remediate Sauce platform coverage" \
            --body "Automatically generated platform coverage remediation."