name: Saucery Coverage Gap Remediation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    name: Remediate platform coverage gaps
    runs-on: ubuntu-latest

    env:
      CONFIG: Release
      UT_PROJECT: Saucery.Core.Tests.XUnitv3/Saucery.Core.Tests.XUnitv3.csproj
      COVERAGE_FORMAT: cobertura
      UNIT_COVERAGE_FILENAME: coverage.cobertura.xml

      SAUCE_USER_NAME: ${{ secrets.SAUCE_USER_NAME }}
      SAUCE_API_KEY: ${{ secrets.SAUCE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet

      - name: Restore Coverage Gap Reporter
        run: >
          dotnet restore
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj

      - name: Build Coverage Gap Reporter
        run: >
          dotnet build
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration ${{ env.CONFIG }}
          --no-restore

      - name: Restore Coverage Gap Remediator
        run: >
          dotnet restore
          Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj

      - name: Build Coverage Gap Remediator
        run: >
          dotnet build
          Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj
          --configuration ${{ env.CONFIG }}
          --no-restore

      - name: Generate current coverage gap report
        run: >
          dotnet run
          --project Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration ${{ env.CONFIG }}
          --no-build
          --
          --repo-root "${{ github.workspace }}"
          --output "${{ github.workspace }}/saucery-functional-platform-coverage-gaps.txt"
          --region us-west-1
          --include-real true

      - name: Print coverage gap report
        run: cat saucery-functional-platform-coverage-gaps.txt

      - name: Apply remediations
        run: >
          dotnet run
          --project Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj
          --configuration ${{ env.CONFIG }}
          --no-build
          --
          --repo-root "${{ github.workspace }}"
          --report "${{ github.workspace }}/saucery-functional-platform-coverage-gaps.txt"
          --apply
          --allow-obsolete-removal

      - name: Show resulting changes
        run: |
          git status --short
          git diff --stat
          git diff

      #
      # HARD VALIDATION GATE
      #
      # Use the exact same xUnit.v3 runner already used by the working
      # repository pipelines.
      #
      - name: Compile remediated solution
        run: dotnet build -c ${{ env.CONFIG }}

      - name: Run xUnit.v3 unit tests
        uses: ./.github/actions/run-xunit3-coverage
        with:
          project: ${{ env.UT_PROJECT }}
          configuration: ${{ env.CONFIG }}
          coverage-format: ${{ env.COVERAGE_FORMAT }}
          coverage-output: ${{ env.UNIT_COVERAGE_FILENAME }}

      #
      # NOTHING BELOW HERE RUNS IF XUNIT.V3 FAILS.
      #
      - name: Check whether source changed
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create remediation branch
        if: success() && steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          BRANCH="automation/platform-coverage-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Commit remediation
        if: success() && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "fix: align Saucery platform coverage with Sauce Labs"

      - name: Push remediation branch
        if: success() && steps.changes.outputs.changed == 'true'
        run: >
          git push
          --set-upstream origin
          "${{ steps.branch.outputs.name }}"

      - name: Create pull request
        if: success() && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head "${{ steps.branch.outputs.name }}" \
            --title "fix: align Saucery platform coverage with Sauce Labs" \
            --body "Automated remediation generated by Saucery.CoverageGapRemediator.

          The workflow:
          - generated the current Sauce Labs platform coverage report
          - applied platform coverage remediations
          - updated Core and test projects
          - rebuilt the remediated solution
          - executed Saucery.Core.Tests.XUnitv3 using the repository's standard run-xunit3-coverage action
          - blocked branch, commit, push, and PR creation when the xUnit.v3 suite failed

          Review the generated source and test changes before merging."

      - name: No remediation required
        if: success() && steps.changes.outputs.changed == 'false'
        run: echo "No repository changes were required."