name: Saucery Coverage Gap Remediation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    name: Remediate platform coverage gaps
    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore Coverage Gap Reporter
        run: >
          dotnet restore
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj

      - name: Build Coverage Gap Reporter
        run: >
          dotnet build
          Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration Release
          --no-restore

      - name: Restore Coverage Gap Remediator
        run: >
          dotnet restore
          Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj

      - name: Build Coverage Gap Remediator
        run: >
          dotnet build
          Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj
          --configuration Release
          --no-restore

      - name: Generate current coverage gap report
        run: >
          dotnet run
          --project Saucery.CoverageGapReporter/Saucery.CoverageGapReporter.csproj
          --configuration Release
          --no-build
          --
          --repo-root "${{ github.workspace }}"
          --output "${{ github.workspace }}/saucery-functional-platform-coverage-gaps.txt"
          --region us-west-1
          --include-real true

      - name: Print coverage gap report
        run: cat saucery-functional-platform-coverage-gaps.txt

      - name: Apply remediations
        run: >
          dotnet run
          --project Saucery.CoverageGapRemediator/Saucery.CoverageGapRemediator.csproj
          --configuration Release
          --no-build
          --
          --repo-root "${{ github.workspace }}"
          --report "${{ github.workspace }}/saucery-functional-platform-coverage-gaps.txt"
          --apply
          --allow-obsolete-removal

      - name: Show resulting changes
        run: |
          git status --short
          git diff --stat
          git diff

      - name: Restore final xUnit.v3 test project
        run: >
          dotnet restore
          Saucery.Core.Tests.XUnitv3/Saucery.Core.Tests.XUnitv3.csproj

      - name: Build final Core project
        run: >
          dotnet build
          Saucery.Core/Saucery.Core.csproj
          --configuration Release

      - name: Build final xUnit.v3 test project
        run: >
          dotnet build
          Saucery.Core.Tests.XUnitv3/Saucery.Core.Tests.XUnitv3.csproj
          --configuration Release
          --no-restore

      - name: Final xUnit.v3 validation gate
        shell: bash
        run: |
          set -uo pipefail

          LOG_FILE="${RUNNER_TEMP}/saucery-xunit-v3-final.log"

          echo "Running final xUnit.v3 suite against the exact remediated working tree..."

          set +e

          dotnet run \
            --project Saucery.Core.Tests.XUnitv3/Saucery.Core.Tests.XUnitv3.csproj \
            --configuration Release \
            --no-build \
            2>&1 | tee "$LOG_FILE"

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          set -e

          echo
          echo "dotnet run exit code: $TEST_EXIT_CODE"
          echo

          #
          # FAIL CLOSED.
          #
          # There are deliberately NO exceptions for Sauce Labs,
          # fixture failures, network failures, JSON failures, or
          # any other condition.
          #
          # If the final test suite does not unequivocally PASS,
          # no branch may be created.
          #

          if [[ "$TEST_EXIT_CODE" -ne 0 ]]; then
            echo "::error::xUnit.v3 process exited with code $TEST_EXIT_CODE."
            exit 1
          fi

          if grep -Fq "Shouldly.ShouldAssertException" "$LOG_FILE"; then
            echo "::error::xUnit.v3 Shouldly assertion failure detected."
            exit 1
          fi

          if grep -Eq 'Assert\.(Equal|True|False|Contains|DoesNotContain|NotNull|Null|Throws)\(\) Failure' "$LOG_FILE"; then
            echo "::error::xUnit.v3 assertion failure detected."
            exit 1
          fi

          if grep -Fq "Test run summary: Failed!" "$LOG_FILE"; then
            echo "::error::Microsoft.Testing.Platform reported a failed test run."
            exit 1
          fi

          if grep -Eq '^[[:space:]]*failed:[[:space:]]*[1-9][0-9]*[[:space:]]*$' "$LOG_FILE"; then
            echo "::error::xUnit.v3 reported one or more failed tests."
            exit 1
          fi

          if grep -Eq '^[[:space:]]*failed[[:space:]]+Saucery\.Core\.Tests\.XUnitv3\.' "$LOG_FILE"; then
            echo "::error::xUnit.v3 failed test result detected."
            exit 1
          fi

          #
          # Do not merely look for the absence of failures.
          # Require an explicit successful test-run summary.
          #
          if ! grep -Fq "Test run summary: Passed!" "$LOG_FILE"; then
            echo "::error::xUnit.v3 did not report an explicit PASS."
            exit 1
          fi

          #
          # Require an explicit zero failure count as a second
          # independent confirmation.
          #
          if ! grep -Eq '^[[:space:]]*failed:[[:space:]]*0[[:space:]]*$' "$LOG_FILE"; then
            echo "::error::xUnit.v3 did not report exactly zero failed tests."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "FINAL XUNIT.V3 VALIDATION: PASS"
          echo "ZERO FAILED TESTS"
          echo "=============================================="

      - name: Check whether source changed
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create remediation branch
        if: success() && steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          BRANCH="automation/platform-coverage-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Commit remediation
        if: success() && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "fix: align Saucery platform coverage with Sauce Labs"

      - name: Push remediation branch
        if: success() && steps.changes.outputs.changed == 'true'
        run: >
          git push
          --set-upstream origin
          "${{ steps.branch.outputs.name }}"

      - name: Create pull request
        if: success() && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head "${{ steps.branch.outputs.name }}" \
            --title "fix: align Saucery platform coverage with Sauce Labs" \
            --body "Automated remediation generated by Saucery.CoverageGapRemediator.

          The workflow:
          - generated the current Sauce Labs platform coverage report
          - applied platform coverage remediations
          - updated the Core test suites
          - rebuilt the final remediated Core project
          - rebuilt Saucery.Core.Tests.XUnitv3
          - executed the complete Saucery.Core.Tests.XUnitv3 suite against the final working tree
          - required an explicit Passed test summary
          - required exactly zero failed tests
          - blocked branch, commit, push, and PR creation unless every xUnit.v3 test passed

          Review the generated source and test changes before merging."

      - name: No remediation required
        if: success() && steps.changes.outputs.changed == 'false'
        run: echo "No repository changes were required."