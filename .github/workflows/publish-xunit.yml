name: Publish Saucery.XUnit to NuGet

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: Saucery.XUnit
  PROJECT_PATH: Saucery.XUnit/Saucery.XUnit.csproj
  PACKAGE_ID: Saucery.XUnit
  CONFIG: Release
  NUPKG_DIR: out
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_USER: fullcircle
  DOTNET_VERSION: 11.0.x
  PUBLISH_MODE: local-version-newer
  TAG_PREFIX: xunit

jobs:
  publish:
    name: build, pack & publish Saucery.XUnit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: nuget-publish

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build, pack and publish package
        id: publish
        uses: ./.github/actions/publish-saucery-package
        with:
          project-path: ${{ env.PROJECT_PATH }}
          package-id: ${{ env.PACKAGE_ID }}
          configuration: ${{ env.CONFIG }}
          nupkg-dir: ${{ env.NUPKG_DIR }}
          nuget-source: ${{ env.NUGET_SOURCE }}
          nuget-user: ${{ env.NUGET_USER }}
          publish-mode: ${{ env.PUBLISH_MODE }}
          tag-prefix: ${{ env.TAG_PREFIX }}

      - name: Publish outcome
        shell: pwsh
        run: |
          Write-Information "Package version: ${{ steps.publish.outputs.version }}"
          Write-Information "Should publish:   ${{ steps.publish.outputs.should-publish }}"
          Write-Information "Published:        ${{ steps.publish.outputs.published }}"
          Write-Information "Tag:              ${{ steps.publish.outputs.tag }}"
